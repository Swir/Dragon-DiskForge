name: Dragon DiskForge Manual Gate Status Contract

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/beta-manual-gate-status.ps1'
      - '.github/workflows/beta-manual-gate-status-contract.yml'
      - 'docs/BETA-MANUAL-GATE-STATUS.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/beta-manual-gate-status.ps1'
      - '.github/workflows/beta-manual-gate-status-contract.yml'
      - 'docs/BETA-MANUAL-GATE-STATUS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Fail-closed manual gate group verifier
    runs-on: windows-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: PowerShell 7 self-test
        shell: pwsh
        run: ./scripts/beta-manual-gate-status.ps1 -Mode self-test

      - name: Windows PowerShell 5.1 self-test
        shell: powershell
        run: .\scripts\beta-manual-gate-status.ps1 -Mode self-test
