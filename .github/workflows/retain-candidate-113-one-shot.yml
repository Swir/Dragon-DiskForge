name: Dragon DiskForge Retain Candidate 113 One Shot

on:
  push:
    branches:
      - release/retain-beta-candidate-113

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@v4
        with:
          ref: release/retain-beta-candidate-113
          fetch-depth: 0

      - name: Synchronize canonical retained candidate evidence
        shell: pwsh
        run: ./.automation/promote-candidate113.ps1

      - name: Verify synchronized evidence and presentation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/retained-beta-candidate-contract.ps1 -Mode self-test
          ./scripts/retained-beta-candidate-contract.ps1 -Mode verify
          ./scripts/beta-docs-consistency.ps1 -Mode self-test
          ./scripts/beta-docs-consistency.ps1 -Mode verify
          ./scripts/retained-beta-archive-binding-contract.ps1 -Mode self-test
          ./scripts/retained-beta-archive-binding-contract.ps1 -Mode verify
          ./scripts/generate-progress-assets.ps1 -Check

          $targets = @('README.md', 'docs/ROADMAP.md', 'docs/STATUS.md')
          $patterns = @('[█▓▒░■□▪▫]{3,}', '\[[#=\-]{5,}\]')
          foreach ($target in $targets) {
            $text = Get-Content -LiteralPath $target -Raw
            foreach ($pattern in $patterns) {
              if ($text -match $pattern) {
                throw ('Legacy progress meter detected in ' + $target + '.')
              }
            }
          }
          git diff --check

      - name: Commit verified promotion and remove staging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --force -r .automation
          git rm --force .github/workflows/retain-candidate-113-one-shot.yml
          git add README.md CHANGELOG.md docs scripts .github/workflows/retained-beta-archive-binding-contract.yml
          if ((git status --porcelain).Count -eq 0) {
            throw 'Promotion produced no changes.'
          }
          git commit -m 'Bind retained candidate #113 to portable archive evidence'
          git push origin HEAD:release/retain-beta-candidate-113
