name: Dragon DiskForge Retain Candidate 113 One Shot

on:
  push:
    branches:
      - release/retain-beta-candidate-113

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@v4
        with:
          ref: release/retain-beta-candidate-113
          fetch-depth: 0

      - name: Synchronize canonical retained candidate evidence
        shell: pwsh
        env:
          EVIDENCE_B64: 
          CONTRACT_B64: 
          WORKFLOW_B64: 
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          function Write-Base64Utf8 {
            param([string]$Path, [string]$Base64)
            $directory = Split-Path -Parent $Path
            if ($directory -and -not (Test-Path -LiteralPath $directory)) {
              New-Item -ItemType Directory -Path $directory -Force | Out-Null
            }
            [System.IO.File]::WriteAllBytes($Path, [Convert]::FromBase64String($Base64))
          }

          Write-Base64Utf8 -Path 'docs/retained-beta-candidate.json' -Base64 $env:EVIDENCE_B64
          Write-Base64Utf8 -Path 'scripts/retained-beta-archive-binding-contract.ps1' -Base64 $env:CONTRACT_B64
          Write-Base64Utf8 -Path '.github/workflows/retained-beta-archive-binding-contract.yml' -Base64 $env:WORKFLOW_B64

          $start = '<!-- retained-beta-candidate:start -->'
          $end = '<!-- retained-beta-candidate:end -->'
          $pattern = '(?s)' + [regex]::Escape($start) + '.*?' + [regex]::Escape($end)
          $candidateSentence = 'Current retained candidate: Beta Candidate run #113 (`35327348417`), artifact `DragonDiskForge-0.5.0-beta.1-win-x64-candidate-35327348417`, built from `main` source commit `48054cc5036ca3809915b3f8392599c315bf2ec7`; nested package SHA-256 `8baeddfed293167e54d827ed1c11e511a3d69c3a80af2a567dfe66e4b78200e7`. Evidence is witness-bound (schema v2) and archive-bound to the packaged desktop witness companion and portable evidence-archive companion and does not claim any human gate. It is a non-public engineering candidate, not a public release.'

          $docSpecs = @(
            @{ Path = 'README.md'; Link = 'docs/retained-beta-candidate.json' },
            @{ Path = 'docs/ROADMAP.md'; Link = 'retained-beta-candidate.json' },
            @{ Path = 'docs/STATUS.md'; Link = 'retained-beta-candidate.json' },
            @{ Path = 'docs/MILESTONES.md'; Link = 'retained-beta-candidate.json' },
            @{ Path = 'docs/BETA-RELEASE.md'; Link = 'retained-beta-candidate.json' }
          )

          foreach ($spec in $docSpecs) {
            $text = Get-Content -LiteralPath $spec.Path -Raw
            $matches = [regex]::Matches($text, $pattern)
            if ($matches.Count -ne 1) { throw "$($spec.Path) must contain exactly one retained candidate block." }
            $replacement = "$start`n$candidateSentence Authoritative retained evidence: [`$($spec.Link)`]($($spec.Link)).`n$end"
            $updated = [regex]::Replace($text, $pattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $replacement }, 1)
            [System.IO.File]::WriteAllText((Resolve-Path -LiteralPath $spec.Path), $updated, (New-Object System.Text.UTF8Encoding($false)))
          }

          $candidatePath = 'docs/BETA-CANDIDATE.md'
          $candidateText = Get-Content -LiteralPath $candidatePath -Raw
          $checkpointPattern = '(?s)### Current retained checkpoint\r?\n.*?(?=\r?\n## Candidate contract script)'
          if (-not [regex]::IsMatch($candidateText, $checkpointPattern)) { throw 'Current retained checkpoint section was not found.' }
          $checkpoint = @'
### Current retained checkpoint

The authoritative retained candidate is **Beta Candidate run #113 (`35327348417`)**, artifact `DragonDiskForge-0.5.0-beta.1-win-x64-candidate-35327348417`, built from `main` commit `48054cc5036ca3809915b3f8392599c315bf2ec7`. The nested package SHA-256 is `8baeddfed293167e54d827ed1c11e511a3d69c3a80af2a567dfe66e4b78200e7`; the GitHub artifact SHA-256 is `014d8971c4434c03ed0577848f968fa1bd1f00294f93796d0e9c18bf206645fe`.

This candidate was intentionally selected by the PR #89 merge after the portable evidence-archive companion was added to the exact-package QA kit. The final PR head passed all required pull-request workflows, and the selected `main` commit then passed Build #506 plus Beta Candidate #113. Independent artifact read-back verified the outer artifact digest, every supplied SHA-256 sidecar, package manifest schema 5, x64 architecture, `.NET=self-contained`, `WindowsAppSDK=self-contained`, `VisualCpp=app-local`, the desktop entry-point hash and the packaged manual-QA-tool hash.

Canonical retained evidence remains schema v2 for compatibility, is witness-bound to the packaged desktop witness companion, and now carries separately verified archive-binding fields for the portable evidence-archive manifest, verifier, helper and guide. The dedicated retained archive-binding contract fails closed if those hashes, the candidate identity, or the synchronized documentation drift. None of these bindings claims a human gate.

The authoritative machine-readable record is [`retained-beta-candidate.json`](retained-beta-candidate.json). It deliberately keeps `publicRelease=false` and `betaReady=false`.

Earlier candidate checkpoints remain historical evidence only. In particular, candidates before the PR #82 same-session binding, PR #87 witness binding or PR #89 portable archive kit must not be mixed with the current manual-QA evidence path.

This reselection does not complete or waive any manual release gate. Clean-desktop visible WinUI launch/basic regression, normal-user UAC behavior and real cross-process Explorer/Desktop drag-out still require human observations against the exact retained package, and the separate 0.7 physical-writer gate still requires dedicated disposable media. Until that evidence exists, the candidate remains non-public and `0.5.0-beta.1` must not be published as a GitHub Release.
'@
          $candidateText = [regex]::Replace($candidateText, $checkpointPattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $checkpoint }, 1)

          $candidateText = $candidateText.Replace(
            '7. build a hash-bound beta QA kit,',
            '7. build the hash-bound core beta QA kit plus the desktop-witness and portable evidence-archive companions,'
          ).Replace(
            '8. retain the ZIP, checksum, candidate metadata and QA kit only when a `main` commit is deliberately marked `[beta-candidate]`,',
            '8. retain the ZIP, checksum, candidate metadata and all hash-bound QA companions only when a `main` commit is deliberately marked `[beta-candidate]`,'
          )

          if ($candidateText -notmatch 'beta-qa-archive-kit\.json') {
            $needle = "BETA-MANUAL-VALIDATION.md`n```"
            if (-not $candidateText.Contains($needle)) { throw 'Retained artifact file-list insertion point was not found.' }
            $extra = @'
BETA-MANUAL-VALIDATION.md
beta-qa-witness-kit.json
beta-qa-witness-kit.json.sha256
beta-qa-witness-kit-verify.ps1
beta-qa-desktop-witness.ps1
BETA-QA-DESKTOP-WITNESS.md
beta-qa-archive-kit.json
beta-qa-archive-kit.json.sha256
beta-qa-archive-kit-verify.ps1
beta-qa-archive.ps1
BETA-QA-EVIDENCE-ARCHIVE.md
```
'@
            $candidateText = $candidateText.Replace($needle, $extra.TrimEnd())
          }
          [System.IO.File]::WriteAllText((Resolve-Path -LiteralPath $candidatePath), $candidateText, (New-Object System.Text.UTF8Encoding($false)))

          $changelogPath = 'CHANGELOG.md'
          $changelog = Get-Content -LiteralPath $changelogPath -Raw
          $oldCandidatePattern = '(?m)^- Beta Candidate run #109 .*?$'
          if (-not [regex]::IsMatch($changelog, $oldCandidatePattern)) { throw 'Current retained-candidate changelog bullet was not found.' }
          $newCandidate = '- Beta Candidate run #113 on `main` commit `48054cc5036ca3809915b3f8392599c315bf2ec7` is the current retained non-public Windows x64 candidate; GitHub artifact SHA-256 `014d8971c4434c03ed0577848f968fa1bd1f00294f93796d0e9c18bf206645fe`, nested package SHA-256 `8baeddfed293167e54d827ed1c11e511a3d69c3a80af2a567dfe66e4b78200e7`; canonical evidence remains schema v2, witness-bound and additionally archive-bound to the portable evidence-archive companion'
          $changelog = [regex]::Replace($changelog, $oldCandidatePattern, $newCandidate, 1)

          $anchor = '- retained-candidate evidence schema v2 binding the candidate package, beta QA kit and desktop witness companion hashes while preserving fail-closed beta readiness'
          if ($changelog.Contains($anchor) -and -not $changelog.Contains('additive retained-candidate archive binding')) {
            $changelog = $changelog.Replace($anchor, $anchor + "`n- additive retained-candidate archive binding for the portable evidence-archive manifest, verifier, helper and guide, enforced by a dedicated fail-closed contract without changing beta readiness")
          }
          [System.IO.File]::WriteAllText((Resolve-Path -LiteralPath $changelogPath), $changelog, (New-Object System.Text.UTF8Encoding($false)))

      - name: Verify synchronized evidence and presentation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/retained-beta-candidate-contract.ps1 -Mode self-test
          ./scripts/retained-beta-candidate-contract.ps1 -Mode verify
          ./scripts/beta-docs-consistency.ps1 -Mode self-test
          ./scripts/beta-docs-consistency.ps1 -Mode verify
          ./scripts/retained-beta-archive-binding-contract.ps1 -Mode self-test
          ./scripts/retained-beta-archive-binding-contract.ps1 -Mode verify
          ./scripts/generate-progress-assets.ps1 -Check

          $targets = @('README.md', 'docs/ROADMAP.md', 'docs/STATUS.md')
          $patterns = @('[█▓▒░■□▪▫]{3,}', '\[[#=\-]{5,}\]')
          foreach ($target in $targets) {
            $text = Get-Content -LiteralPath $target -Raw
            foreach ($pattern in $patterns) {
              if ($text -match $pattern) { throw "Legacy progress meter detected in $target." }
            }
          }

          git diff --check

      - name: Commit verified promotion and remove one-shot workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --force .github/workflows/retain-candidate-113-one-shot.yml
          git add README.md CHANGELOG.md docs scripts .github/workflows/retained-beta-archive-binding-contract.yml
          if ((git status --porcelain).Count -eq 0) { throw 'Promotion produced no changes.' }
          git commit -m "Bind retained candidate #113 to portable archive evidence"
          git push origin HEAD:release/retain-beta-candidate-113
