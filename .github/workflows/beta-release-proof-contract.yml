name: Dragon DiskForge Beta Release Proof Contract

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: dragon-beta-release-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Exact candidate/package/manual-QA proof contract
    runs-on: windows-latest

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: PowerShell 7 release-proof self-test
        shell: pwsh
        run: ./scripts/beta-release-proof.ps1 -Mode self-test

      - name: Windows PowerShell 5.1 release-proof self-test
        shell: powershell
        run: .\scripts\beta-release-proof.ps1 -Mode self-test
