name: Dragon DiskForge Explorer QA Kit Contract

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: dragon-beta-explorer-kit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Package-bound Explorer witness companion
    runs-on: windows-latest

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: PowerShell 7 self-test
        shell: pwsh
        run: ./scripts/beta-qa-explorer-kit.ps1 -Mode self-test

      - name: Windows PowerShell 5.1 self-test
        shell: powershell
        run: .\scripts\beta-qa-explorer-kit.ps1 -Mode self-test
