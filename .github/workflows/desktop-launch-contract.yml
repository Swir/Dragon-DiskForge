name: Dragon DiskForge Desktop Launch Contract

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: dragon-desktop-launch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-launch:
    name: Self-contained desktop launch • Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore desktop app
        run: msbuild src/DragonDiskForge.App/DragonDiskForge.App.csproj /restore /p:Configuration=Release /p:Platform=x64

      - name: Build desktop app
        run: msbuild src/DragonDiskForge.App/DragonDiskForge.App.csproj /m /p:Configuration=Release /p:Platform=x64 /p:RestoreIgnoreFailedSources=false

      - name: Build package candidate
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Verify self-contained runtime and desktop startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $package = (Resolve-Path 'artifacts/windows/DragonDiskForge-win-x64.zip').Path
          $extract = Join-Path $env:RUNNER_TEMP 'dragon-diskforge-desktop-launch'
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $package -DestinationPath $extract -Force

          $manifest = Get-Content (Join-Path $extract 'package-manifest.json') -Raw | ConvertFrom-Json
          $app = Join-Path $extract ([string]$manifest.entryPoint)
          if (-not (Test-Path $app -PathType Leaf)) { throw "Desktop entry point is missing: $app" }

          foreach ($runtimeFile in @('hostfxr.dll', 'hostpolicy.dll', 'coreclr.dll', 'clrjit.dll')) {
            $runtimePath = Join-Path $extract $runtimeFile
            if (-not (Test-Path $runtimePath -PathType Leaf)) {
              throw "Desktop package is not .NET self-contained; missing $runtimeFile."
            }
          }

          # Remove SDK/toolchain discovery from the launch environment. A valid beta
          # package must carry the .NET runtime and Windows App SDK runtime it needs.
          $env:DOTNET_ROOT = Join-Path $env:RUNNER_TEMP 'missing-dotnet-root'
          $env:DOTNET_ROOT_X64 = $env:DOTNET_ROOT
          $env:PATH = [string]::Join(';', @($env:PATH -split ';' | Where-Object {
            $_ -and $_ -notmatch '(?i)\\dotnet($|\\)' -and $_ -notmatch '(?i)Visual Studio'
          }))

          $process = Start-Process -FilePath $app -WorkingDirectory $extract -PassThru
          try {
            Start-Sleep -Seconds 6
            $process.Refresh()
            if ($process.HasExited) {
              throw "DragonDiskForge.App.exe exited during the desktop launch probe with code $($process.ExitCode)."
            }
            Write-Host "Desktop launch probe passed; process remained alive for 6 seconds without SDK/runtime discovery."
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }
