name: Dragon DiskForge Retained Candidate Documentation Sync

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: dragon-retained-doc-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Retained candidate docs sync
    runs-on: windows-latest

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: PowerShell 7 self-test
        shell: pwsh
        run: ./scripts/sync-retained-candidate-docs.ps1 -Mode self-test

      - name: Windows PowerShell 5.1 self-test
        shell: powershell
        run: .\scripts\sync-retained-candidate-docs.ps1 -Mode self-test

      - name: Apply deterministic retained-candidate projection
        shell: pwsh
        run: ./scripts/sync-retained-candidate-docs.ps1 -Mode apply

      - name: Export synchronized retained-candidate projection
        uses: actions/upload-artifact@v4
        with:
          name: retained-candidate-docs-sync-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1
          path: |
            README.md
            CHANGELOG.md
            docs/ROADMAP.md
            docs/STATUS.md
            docs/MILESTONES.md
            docs/BETA-RELEASE.md
            docs/BETA-CANDIDATE.md
            docs/retained-beta-candidate.json

      - name: Verify active retained-candidate narrative
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Get-Content -LiteralPath 'docs/retained-beta-candidate.json' -Raw | ConvertFrom-Json
          $expectedRun = [string]$evidence.workflowRunNumber
          $expectedSchema = [string]$evidence.packageManifestSchema

          $rules = @(
            @{ Path = 'docs/ROADMAP.md'; Pattern = 'Candidate #(?<run>\d+) is the current retained package-bound target' },
            @{ Path = 'docs/MILESTONES.md'; Pattern = 'Candidate #(?<run>\d+) is the current retained package-bound target' },
            @{ Path = 'docs/BETA-RELEASE.md'; Pattern = 'Candidate #(?<run>\d+) is the current retained package-bound target' }
          )

          foreach ($rule in $rules) {
            $text = Get-Content -LiteralPath $rule.Path -Raw
            $matches = [regex]::Matches($text, $rule.Pattern)
            if ($matches.Count -ne 1) {
              throw "$($rule.Path) must contain exactly one active retained-candidate narrative; found $($matches.Count)."
            }
            $actualRun = $matches[0].Groups['run'].Value
            if ($actualRun -ne $expectedRun) {
              throw "$($rule.Path) active retained candidate #$actualRun is stale; expected #$expectedRun."
            }
          }

          $status = Get-Content -LiteralPath 'docs/STATUS.md' -Raw
          $schemaMatch = [regex]::Match($status, 'The retained artifact is package-manifest schema (?<schema>\d+)')
          if (-not $schemaMatch.Success) {
            throw 'docs/STATUS.md is missing the active retained package-manifest schema narrative.'
          }
          if ($schemaMatch.Groups['schema'].Value -ne $expectedSchema) {
            throw "docs/STATUS.md retained package-manifest schema $($schemaMatch.Groups['schema'].Value) is stale; expected $expectedSchema."
          }

      - name: Verify repository is already synchronized
        shell: bash
        run: |
          git diff --exit-code --ignore-space-at-eol --ignore-cr-at-eol -- \
            README.md \
            CHANGELOG.md \
            docs/ROADMAP.md \
            docs/STATUS.md \
            docs/MILESTONES.md \
            docs/BETA-RELEASE.md \
            docs/BETA-CANDIDATE.md \
            .github/workflows/beta-retained-explorer-currency.yml
