name: Dragon DiskForge Retained Candidate Documentation Sync

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: dragon-retained-doc-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Retained candidate docs sync
    runs-on: windows-latest

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: PowerShell 7 self-test
        shell: pwsh
        run: ./scripts/sync-retained-candidate-docs.ps1 -Mode self-test

      - name: Windows PowerShell 5.1 self-test
        shell: powershell
        run: .\scripts\sync-retained-candidate-docs.ps1 -Mode self-test

      - name: Normalize maintained text files for deterministic comparison
        shell: pwsh
        run: |
          $paths = @(
            'README.md',
            'CHANGELOG.md',
            'docs/ROADMAP.md',
            'docs/STATUS.md',
            'docs/MILESTONES.md',
            'docs/BETA-RELEASE.md',
            'docs/BETA-CANDIDATE.md',
            '.github/workflows/beta-retained-explorer-currency.yml'
          )
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          foreach ($path in $paths) {
            $text = Get-Content -LiteralPath $path -Raw
            $text = $text.Replace("`r`n", "`n")
            [System.IO.File]::WriteAllText($path, $text, $utf8)
          }

      - name: Verify retained candidate documentation
        shell: pwsh
        run: ./scripts/sync-retained-candidate-docs.ps1 -Mode verify
