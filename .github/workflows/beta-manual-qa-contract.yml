name: Dragon DiskForge Beta Manual QA Contract

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: dragon-beta-manual-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta-manual-qa-contract:
    name: Beta manual QA evidence contract
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell 7 contract self-test
        shell: pwsh
        run: |
          ./scripts/beta-manual-qa.ps1 -Mode self-test
          ./scripts/beta-qa-session.ps1 -Mode self-test
          ./scripts/beta-qa-archive.ps1 -Mode self-test
          ./scripts/beta-qa-desktop-witness.ps1 -Mode self-test

      - name: Windows PowerShell 5.1 contract self-test
        shell: powershell
        run: |
          .\scripts\beta-manual-qa.ps1 -Mode self-test
          .\scripts\beta-qa-session.ps1 -Mode self-test
          .\scripts\beta-qa-archive.ps1 -Mode self-test
          .\scripts\beta-qa-desktop-witness.ps1 -Mode self-test
