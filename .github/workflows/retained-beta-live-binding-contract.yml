name: Dragon DiskForge Retained Beta Live Binding Contract

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dragon-retained-beta-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Retained live-session binding
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell 7 retained live-binding self-test
        shell: pwsh
        run: ./scripts/retained-beta-live-binding-contract.ps1 -Mode self-test

      - name: PowerShell 7 retained live-binding verify
        shell: pwsh
        run: ./scripts/retained-beta-live-binding-contract.ps1 -Mode verify

      - name: Windows PowerShell 5.1 retained live-binding self-test
        shell: powershell
        run: .\scripts\retained-beta-live-binding-contract.ps1 -Mode self-test

      - name: Windows PowerShell 5.1 retained live-binding verify
        shell: powershell
        run: .\scripts\retained-beta-live-binding-contract.ps1 -Mode verify
