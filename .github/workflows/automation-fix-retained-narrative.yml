name: Automation Fix Retained Candidate Narrative

on:
  push:
    branches:
      - automation/retain-candidate-252

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden retained-candidate synchronizer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'scripts/sync-retained-candidate-docs.ps1'
          $text = Get-Content -LiteralPath $path -Raw

          $old = @'
                  if ($spec.Path -in @('docs/ROADMAP.md', 'docs/STATUS.md', 'docs/MILESTONES.md', 'CHANGELOG.md')) { $updated = Add-HistoryLine -Text $updated }
                  if ($Apply) { Write-Utf8NoBom -Path $path -Text $updated }
          '@

          $new = @'
                  if ($spec.Path -in @('docs/ROADMAP.md', 'docs/STATUS.md', 'docs/MILESTONES.md', 'CHANGELOG.md')) { $updated = Add-HistoryLine -Text $updated }
                  if ($spec.Path -in @('docs/ROADMAP.md', 'docs/MILESTONES.md', 'docs/BETA-RELEASE.md')) {
                      $narrativePattern = 'Candidate #\d+ is the current retained package-bound target'
                      $narrativeMatches = [regex]::Matches($updated, $narrativePattern)
                      if ($narrativeMatches.Count -ne 1) { throw "$($spec.Path) must contain exactly one active retained-candidate narrative; found $($narrativeMatches.Count)." }
                      $replacement = "Candidate #$($E.workflowRunNumber) is the current retained package-bound target"
                      $updated = [regex]::Replace($updated, $narrativePattern, $replacement, 1)
                  }
                  if ($Apply) { Write-Utf8NoBom -Path $path -Text $updated }
          '@

          if (-not $text.Contains($old)) {
            throw 'Synchronizer patch anchor was not found.'
          }
          $text = $text.Replace($old, $new)

          $selfTestAnchor = @'
                  if (-not $releaseText.Contains(('a' * 64)) -or -not $releaseText.Contains(('b' * 64)) -or $releaseText -notmatch '(?i)pair verifier') {
                      throw 'Schema-6 beta release read-back did not bind both UAC provenance hashes.'
                  }
          '@

          $selfTestReplacement = @'
                  if (-not $releaseText.Contains(('a' * 64)) -or -not $releaseText.Contains(('b' * 64)) -or $releaseText -notmatch '(?i)pair verifier') {
                      throw 'Schema-6 beta release read-back did not bind both UAC provenance hashes.'
                  }

                  foreach ($relative in @('docs/ROADMAP.md', 'docs/MILESTONES.md', 'docs/BETA-RELEASE.md')) {
                      $narrativeText = Get-Content -LiteralPath (Join-Path $tempRoot $relative) -Raw
                      $expectedNarrative = "Candidate #$($e6.workflowRunNumber) is the current retained package-bound target"
                      $narrativeMatches = [regex]::Matches($narrativeText, 'Candidate #\d+ is the current retained package-bound target')
                      if ($narrativeMatches.Count -ne 1 -or $narrativeMatches[0].Value -ne $expectedNarrative) {
                          throw "$relative did not synchronize the active retained-candidate narrative to run #$($e6.workflowRunNumber)."
                      }
                  }
          '@

          if (-not $text.Contains($selfTestAnchor)) {
            throw 'Synchronizer self-test patch anchor was not found.'
          }
          $text = $text.Replace($selfTestAnchor, $selfTestReplacement)
          [System.IO.File]::WriteAllText((Resolve-Path $path), $text, (New-Object System.Text.UTF8Encoding($false)))

      - name: Self-test, apply and verify projection
        shell: pwsh
        run: |
          ./scripts/sync-retained-candidate-docs.ps1 -Mode self-test
          ./scripts/sync-retained-candidate-docs.ps1 -Mode apply
          ./scripts/sync-retained-candidate-docs.ps1 -Mode verify

      - name: Verify Candidate 252 narrative consistency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('docs/ROADMAP.md', 'docs/MILESTONES.md', 'docs/BETA-RELEASE.md')) {
            $text = Get-Content -LiteralPath $path -Raw
            $matches = [regex]::Matches($text, 'Candidate #(?<run>\d+) is the current retained package-bound target')
            if ($matches.Count -ne 1 -or $matches[0].Groups['run'].Value -ne '252') {
              throw "$path retained-candidate narrative is not exactly Candidate #252."
            }
          }

      - name: Commit synchronizer hardening and projection
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync-retained-candidate-docs.ps1 README.md CHANGELOG.md docs/ROADMAP.md docs/STATUS.md docs/MILESTONES.md docs/BETA-RELEASE.md docs/BETA-CANDIDATE.md .github/workflows/beta-retained-explorer-currency.yml
          if (git diff --cached --quiet) {
            Write-Host "Synchronizer and documentation are already consistent."
            exit 0
          }
          git commit -m "beta: keep retained candidate narratives synchronized"
          git push origin HEAD:automation/retain-candidate-252
