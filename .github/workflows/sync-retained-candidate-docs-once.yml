name: Temporary retained candidate docs sync

on:
  push:
    branches:
      - evidence/retain-candidate-188

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize retained candidate documentation
        shell: pwsh
        run: |
          ./scripts/sync-retained-candidate-docs.ps1 -Mode apply
          ./scripts/sync-retained-candidate-docs.ps1 -Mode verify
          ./scripts/sync-retained-candidate-docs.ps1 -Mode self-test

      - name: Commit synchronized evidence docs
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if (-not $changes) {
            Write-Host 'Retained candidate docs already synchronized.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md docs/ROADMAP.md docs/STATUS.md docs/MILESTONES.md docs/BETA-RELEASE.md docs/BETA-CANDIDATE.md .github/workflows/beta-retained-explorer-currency.yml
          git commit -m '[beta-candidate] Sync retained Candidate #188 evidence'
          git push origin HEAD:evidence/retain-candidate-188
