name: Bootstrap retained candidate 158 documentation sync

on:
  push:
    branches: [ hardening/retain-candidate-158 ]

permissions:
  contents: write

concurrency:
  group: dragon-retained-candidate-158-bootstrap
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Seed Explorer candidate inventory
        shell: pwsh
        run: |
          $path = 'docs/BETA-CANDIDATE.md'
          $text = Get-Content -LiteralPath $path -Raw
          if (-not $text.Contains('beta-qa-explorer-kit.json')) {
            $anchor = 'BETA-QA-EVIDENCE-ARCHIVE.md.sha256'
            if (-not $text.Contains($anchor)) { throw 'Explorer inventory anchor is missing.' }
            $addition = @(
              'beta-qa-explorer-kit.json',
              'beta-qa-explorer-kit.json.sha256',
              'beta-qa-explorer-kit.ps1',
              'beta-qa-explorer-kit.ps1.sha256',
              'beta-qa-explorer-witness.ps1',
              'beta-qa-explorer-witness.ps1.sha256',
              'BETA-QA-EXPLORER-WITNESS.md',
              'BETA-QA-EXPLORER-WITNESS.md.sha256'
            ) -join [Environment]::NewLine
            $text = $text.Replace($anchor, $anchor + [Environment]::NewLine + $addition)
            [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          }

      - name: Self-test documentation synchronizer
        shell: pwsh
        run: ./scripts/sync-retained-candidate-docs.ps1 -Mode self-test

      - name: Apply retained candidate documentation sync
        shell: pwsh
        run: ./scripts/sync-retained-candidate-docs.ps1 -Mode apply

      - name: Verify synchronized state
        shell: pwsh
        run: ./scripts/sync-retained-candidate-docs.ps1 -Mode verify

      - name: Commit synchronized documentation
        shell: pwsh
        run: |
          if (git diff --quiet) {
            throw 'Retained candidate sync produced no repository changes.'
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md docs/ROADMAP.md docs/STATUS.md docs/MILESTONES.md docs/BETA-RELEASE.md docs/BETA-CANDIDATE.md .github/workflows/beta-retained-explorer-currency.yml
          git commit -m 'Synchronize retained beta candidate 158 docs'
          git push origin HEAD:hardening/retain-candidate-158
