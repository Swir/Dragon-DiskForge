name: Dragon DiskForge Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: dragon-diskforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Core smoke tests
        run: dotnet run --project tests/DragonDiskForge.Core.SmokeTests/DragonDiskForge.Core.SmokeTests.csproj -c Release

      - name: Provider registry smoke tests
        run: dotnet run --project tests/DragonDiskForge.ProviderRegistry.SmokeTests/DragonDiskForge.ProviderRegistry.SmokeTests.csproj -c Release

      - name: Partition intelligence smoke tests
        run: dotnet run --project tests/DragonDiskForge.PartitionIntelligence.SmokeTests/DragonDiskForge.PartitionIntelligence.SmokeTests.csproj -c Release

      - name: Filesystem recognition smoke tests
        run: dotnet run --project tests/DragonDiskForge.FileSystemRecognition.SmokeTests/DragonDiskForge.FileSystemRecognition.SmokeTests.csproj -c Release

      - name: Boot + installer intelligence smoke tests
        run: dotnet run --project tests/DragonDiskForge.BootInstallerIntelligence.SmokeTests/DragonDiskForge.BootInstallerIntelligence.SmokeTests.csproj -c Release

      - name: Unified image intelligence smoke tests
        run: dotnet run --project tests/DragonDiskForge.ImageIntelligence.SmokeTests/DragonDiskForge.ImageIntelligence.SmokeTests.csproj -c Release

      - name: Image report smoke tests
        run: dotnet run --project tests/DragonDiskForge.ImageReport.SmokeTests/DragonDiskForge.ImageReport.SmokeTests.csproj -c Release

      - name: RAW/IMG partition-provider smoke tests
        run: dotnet run --project tests/DragonDiskForge.RawPartition.SmokeTests/DragonDiskForge.RawPartition.SmokeTests.csproj -c Release

      - name: IMA/floppy provider smoke tests
        run: dotnet run --project tests/DragonDiskForge.Floppy.SmokeTests/DragonDiskForge.Floppy.SmokeTests.csproj -c Release

      - name: BIN/CUE provider smoke tests
        run: dotnet run --project tests/DragonDiskForge.BinCue.SmokeTests/DragonDiskForge.BinCue.SmokeTests.csproj -c Release

      - name: MDF/MDS provider smoke tests
        run: dotnet run --project tests/DragonDiskForge.Mds.SmokeTests/DragonDiskForge.Mds.SmokeTests.csproj -c Release

      - name: NRG provider smoke tests
        run: dotnet run --project tests/DragonDiskForge.Nrg.SmokeTests/DragonDiskForge.Nrg.SmokeTests.csproj -c Release

      - name: CCD/IMG/SUB provider smoke tests
        run: dotnet run --project tests/DragonDiskForge.Ccd.SmokeTests/DragonDiskForge.Ccd.SmokeTests.csproj -c Release

      - name: VMDK sparse metadata smoke tests
        run: dotnet run --project tests/DragonDiskForge.Vmdk.SmokeTests/DragonDiskForge.Vmdk.SmokeTests.csproj -c Release

      - name: QCOW/QCOW2 metadata smoke tests
        run: dotnet run --project tests/DragonDiskForge.Qcow.SmokeTests/DragonDiskForge.Qcow.SmokeTests.csproj -c Release

      - name: DMG / UDIF metadata smoke tests
        run: dotnet run --project tests/DragonDiskForge.Dmg.SmokeTests/DragonDiskForge.Dmg.SmokeTests.csproj -c Release

      - name: WIM / ESD metadata smoke tests
        run: dotnet run --project tests/DragonDiskForge.Wim.SmokeTests/DragonDiskForge.Wim.SmokeTests.csproj -c Release

      - name: FFU metadata smoke tests
        run: dotnet run --project tests/DragonDiskForge.Ffu.SmokeTests/DragonDiskForge.Ffu.SmokeTests.csproj -c Release

      - name: Mount history smoke tests
        run: dotnet run --project tests/DragonDiskForge.MountHistory.SmokeTests/DragonDiskForge.MountHistory.SmokeTests.csproj -c Release

      - name: Drag-out safety smoke tests
        run: dotnet run --project tests/DragonDiskForge.DragOut.SmokeTests/DragonDiskForge.DragOut.SmokeTests.csproj -c Release

      - name: ISO direct-browse integration
        run: dotnet run --project tests/DragonDiskForge.DirectBrowse.IntegrationTests/DragonDiskForge.DirectBrowse.IntegrationTests.csproj -c Release

      - name: Native Windows mount integration
        run: dotnet run --project tests/DragonDiskForge.Windows.IntegrationTests/DragonDiskForge.Windows.IntegrationTests.csproj -c Release

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild DragonDiskForge.sln /restore /p:Configuration=Release /p:Platform=x64

      - name: Build
        run: msbuild DragonDiskForge.sln /m /p:Configuration=Release /p:Platform=x64 /p:RestoreIgnoreFailedSources=false

      - name: Publish Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: DragonDiskForge-win-x64
          path: src/DragonDiskForge.App/bin/x64/Release/**
          if-no-files-found: error
          retention-days: 14
