name: Automation Retained Candidate Docs Sync

on:
  push:
    branches:
      - automation/retain-candidate-252

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate synchronizer
        shell: pwsh
        run: ./scripts/sync-retained-candidate-docs.ps1 -Mode self-test

      - name: Apply deterministic retained-candidate projection
        shell: pwsh
        run: ./scripts/sync-retained-candidate-docs.ps1 -Mode apply

      - name: Verify synchronized projection
        shell: pwsh
        run: ./scripts/sync-retained-candidate-docs.ps1 -Mode verify

      - name: Commit synchronized documentation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md docs/ROADMAP.md docs/STATUS.md docs/MILESTONES.md docs/BETA-RELEASE.md docs/BETA-CANDIDATE.md .github/workflows/beta-retained-explorer-currency.yml
          if (git diff --cached --quiet) {
            Write-Host "Documentation already synchronized."
            exit 0
          }
          git commit -m "docs: sync retained Candidate #252"
          git push origin HEAD:automation/retain-candidate-252
