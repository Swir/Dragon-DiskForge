name: Dragon DiskForge Beta Candidate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      retain_candidate:
        description: Upload the exact non-public Windows x64 candidate artifact for manual QA
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dragon-beta-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta-candidate:
    name: Exact 0.5.0-beta.1 Windows x64 candidate
    runs-on: windows-latest
    env:
      BETA_VERSION: 0.5.0-beta.1
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      - name: PowerShell 7 beta candidate contract self-test
        shell: pwsh
        run: ./scripts/beta-candidate.ps1 -Mode self-test

      - name: Windows PowerShell 5.1 beta candidate contract self-test
        shell: powershell
        run: .\scripts\beta-candidate.ps1 -Mode self-test

      - name: PowerShell 7 retention policy self-test
        shell: pwsh
        run: ./scripts/beta-candidate-retention-policy.ps1 -Mode self-test

      - name: Windows PowerShell 5.1 retention policy self-test
        shell: powershell
        run: .\scripts\beta-candidate-retention-policy.ps1 -Mode self-test

      - name: PowerShell 7 retained-candidate currency self-test
        shell: pwsh
        run: ./scripts/beta-retained-currency.ps1 -Mode self-test

      - name: Windows PowerShell 5.1 retained-candidate currency self-test
        shell: powershell
        run: .\scripts\beta-retained-currency.ps1 -Mode self-test

      - name: PowerShell 7 beta QA kit contract self-test
        shell: pwsh
        run: ./scripts/beta-qa-kit.ps1 -Mode self-test

      - name: Windows PowerShell 5.1 beta QA kit contract self-test
        shell: powershell
        run: .\scripts\beta-qa-kit.ps1 -Mode self-test

      - name: PowerShell 7 Explorer witness companion self-test
        shell: pwsh
        run: ./scripts/beta-qa-explorer-kit.ps1 -Mode self-test

      - name: Windows PowerShell 5.1 Explorer witness companion self-test
        shell: powershell
        run: .\scripts\beta-qa-explorer-kit.ps1 -Mode self-test

      - name: PowerShell 7 live-session companion self-test
        shell: pwsh
        run: ./scripts/beta-qa-live-kit.ps1 -Mode self-test

      - name: Windows PowerShell 5.1 live-session companion self-test
        shell: powershell
        run: .\scripts\beta-qa-live-kit.ps1 -Mode self-test

      - name: PowerShell 7 desktop witness companion self-test
        shell: pwsh
        run: ./scripts/beta-qa-witness-kit.ps1 -Mode self-test

      - name: Windows PowerShell 5.1 desktop witness companion self-test
        shell: powershell
        run: .\scripts\beta-qa-witness-kit.ps1 -Mode self-test

      - name: PowerShell 7 portable evidence archive kit self-test
        shell: pwsh
        run: ./scripts/beta-qa-archive-kit.ps1 -Mode self-test

      - name: Windows PowerShell 5.1 portable evidence archive kit self-test
        shell: powershell
        run: .\scripts\beta-qa-archive-kit.ps1 -Mode self-test

      - name: Decide candidate retention
        id: retention-policy
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RETAIN_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.retain_candidate || false }}
        run: |
          $requested = [System.Convert]::ToBoolean("$env:RETAIN_REQUESTED")
          $decision = ./scripts/beta-candidate-retention-policy.ps1 -Mode evaluate -EventName $env:EVENT_NAME -RefName $env:REF_NAME -CommitMessage $env:COMMIT_MESSAGE -RetainRequested $requested
          if ($decision -notin @('true', 'false')) {
            throw "Unexpected retention policy result: '$decision'."
          }
          "retain=$decision" >> $env:GITHUB_OUTPUT
          Write-Host "Retain candidate: $decision"

      - name: Promote workspace metadata to beta suffix
        shell: pwsh
        run: ./scripts/beta-candidate.ps1 -Mode prepare

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore beta candidate
        run: msbuild DragonDiskForge.sln /restore /p:Configuration=Release /p:Platform=x64

      - name: Build beta candidate
        run: msbuild DragonDiskForge.sln /m /p:Configuration=Release /p:Platform=x64 /p:RestoreIgnoreFailedSources=false

      - name: Build exact Windows x64 beta package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -ExpectedVersion $env:BETA_VERSION

      - name: Verify exact Windows x64 beta package
        shell: pwsh
        run: ./scripts/verify-package.ps1 -ExpectedVersion $env:BETA_VERSION

      - name: Bind candidate metadata to source commit and package hash
        shell: pwsh
        run: ./scripts/beta-candidate.ps1 -Mode metadata -ExpectedPrefix 0.5.0 -BetaSuffix beta.1 -SourceCommit $env:SOURCE_COMMIT -WorkflowRunId '${{ github.run_id }}'

      - name: Build hash-bound beta QA kit schema v2
        shell: pwsh
        run: ./scripts/beta-qa-kit.ps1 -Mode build

      - name: Verify standalone beta QA kit with PowerShell 7
        shell: pwsh
        run: ./artifacts/windows/beta-qa-kit-verify.ps1 -ManifestPath ./artifacts/windows/beta-qa-kit.json

      - name: Verify standalone beta QA kit with Windows PowerShell 5.1
        shell: powershell
        run: .\artifacts\windows\beta-qa-kit-verify.ps1 -ManifestPath .\artifacts\windows\beta-qa-kit.json

      - name: Build package-bound Explorer witness companion
        shell: pwsh
        run: ./scripts/beta-qa-explorer-kit.ps1 -Mode build

      - name: Verify Explorer witness companion with PowerShell 7
        shell: pwsh
        run: ./artifacts/windows/beta-qa-explorer-kit.ps1 -Mode verify -ExplorerKitPath ./artifacts/windows/beta-qa-explorer-kit.json

      - name: Verify Explorer witness companion with Windows PowerShell 5.1
        shell: powershell
        run: .\artifacts\windows\beta-qa-explorer-kit.ps1 -Mode verify -ExplorerKitPath .\artifacts\windows\beta-qa-explorer-kit.json

      - name: Build hash-bound live-session companion
        shell: pwsh
        run: ./scripts/beta-qa-live-kit.ps1 -Mode build

      - name: Verify standalone live-session companion with PowerShell 7
        shell: pwsh
        run: ./artifacts/windows/beta-qa-live-kit-verify.ps1 -ManifestPath ./artifacts/windows/beta-qa-live-kit.json

      - name: Verify standalone live-session companion with Windows PowerShell 5.1
        shell: powershell
        run: .\artifacts\windows\beta-qa-live-kit-verify.ps1 -ManifestPath .\artifacts\windows\beta-qa-live-kit.json

      - name: Build hash-bound desktop witness companion
        shell: pwsh
        run: ./scripts/beta-qa-witness-kit.ps1 -Mode build

      - name: Verify standalone desktop witness companion with PowerShell 7
        shell: pwsh
        run: ./artifacts/windows/beta-qa-witness-kit-verify.ps1 -ManifestPath ./artifacts/windows/beta-qa-witness-kit.json

      - name: Verify standalone desktop witness companion with Windows PowerShell 5.1
        shell: powershell
        run: .\artifacts\windows\beta-qa-witness-kit-verify.ps1 -ManifestPath .\artifacts\windows\beta-qa-witness-kit.json

      - name: Build hash-bound portable evidence archive kit
        shell: pwsh
        run: ./scripts/beta-qa-archive-kit.ps1 -Mode build

      - name: Verify standalone portable evidence archive kit with PowerShell 7
        shell: pwsh
        run: ./artifacts/windows/beta-qa-archive-kit-verify.ps1 -ManifestPath ./artifacts/windows/beta-qa-archive-kit.json

      - name: Verify standalone portable evidence archive kit with Windows PowerShell 5.1
        shell: powershell
        run: .\artifacts\windows\beta-qa-archive-kit-verify.ps1 -ManifestPath .\artifacts\windows\beta-qa-archive-kit.json

      - name: Publish explicitly selected non-public beta candidate
        if: steps.retention-policy.outputs.retain == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DragonDiskForge-0.5.0-beta.1-win-x64-candidate-${{ github.run_id }}
          path: |
            artifacts/windows/DragonDiskForge-win-x64.zip
            artifacts/windows/DragonDiskForge-win-x64.zip.sha256
            artifacts/windows/beta-candidate.json
            artifacts/windows/beta-candidate.json.sha256
            artifacts/windows/beta-qa-kit.json
            artifacts/windows/beta-qa-kit.json.sha256
            artifacts/windows/beta-qa-kit-verify.ps1
            artifacts/windows/beta-qa-kit-verify.ps1.sha256
            artifacts/windows/beta-qa-session.ps1
            artifacts/windows/beta-qa-session.ps1.sha256
            artifacts/windows/BETA-QA-KIT.md
            artifacts/windows/BETA-QA-KIT.md.sha256
            artifacts/windows/BETA-MANUAL-VALIDATION.md
            artifacts/windows/BETA-MANUAL-VALIDATION.md.sha256
            artifacts/windows/beta-qa-explorer-kit.json
            artifacts/windows/beta-qa-explorer-kit.json.sha256
            artifacts/windows/beta-qa-explorer-kit.ps1
            artifacts/windows/beta-qa-explorer-kit.ps1.sha256
            artifacts/windows/beta-qa-explorer-witness.ps1
            artifacts/windows/beta-qa-explorer-witness.ps1.sha256
            artifacts/windows/BETA-QA-EXPLORER-WITNESS.md
            artifacts/windows/BETA-QA-EXPLORER-WITNESS.md.sha256
            artifacts/windows/beta-qa-live-kit.json
            artifacts/windows/beta-qa-live-kit.json.sha256
            artifacts/windows/beta-qa-live-kit-verify.ps1
            artifacts/windows/beta-qa-live-kit-verify.ps1.sha256
            artifacts/windows/beta-qa-live-session.ps1
            artifacts/windows/beta-qa-live-session.ps1.sha256
            artifacts/windows/BETA-QA-LIVE-SESSION.md
            artifacts/windows/BETA-QA-LIVE-SESSION.md.sha256
            artifacts/windows/beta-qa-witness-kit.json
            artifacts/windows/beta-qa-witness-kit.json.sha256
            artifacts/windows/beta-qa-witness-kit-verify.ps1
            artifacts/windows/beta-qa-witness-kit-verify.ps1.sha256
            artifacts/windows/beta-qa-desktop-witness.ps1
            artifacts/windows/beta-qa-desktop-witness.ps1.sha256
            artifacts/windows/BETA-QA-DESKTOP-WITNESS.md
            artifacts/windows/BETA-QA-DESKTOP-WITNESS.md.sha256
            artifacts/windows/beta-qa-archive-kit.json
            artifacts/windows/beta-qa-archive-kit.json.sha256
            artifacts/windows/beta-qa-archive-kit-verify.ps1
            artifacts/windows/beta-qa-archive-kit-verify.ps1.sha256
            artifacts/windows/beta-qa-archive.ps1
            artifacts/windows/beta-qa-archive.ps1.sha256
            artifacts/windows/BETA-QA-EVIDENCE-ARCHIVE.md
            artifacts/windows/BETA-QA-EVIDENCE-ARCHIVE.md.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Explain verification-only runs
        if: steps.retention-policy.outputs.retain != 'true'
        shell: pwsh
        run: |
          Write-Host "Candidate package, metadata, schema-v2 hash-bound QA kit, package-bound Explorer witness companion, live-session companion, desktop-witness companion and portable evidence-archive kit build/verification passed."
          Write-Host "No retained 160+ MiB artifact was uploaded because this run was not explicitly selected by the fail-closed retention policy."
