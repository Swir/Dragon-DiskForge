name: Dragon DiskForge Beta QA Witness Kit Contract

on:
  pull_request:
    paths:
      - 'scripts/beta-qa-witness-kit.ps1'
      - 'scripts/beta-qa-witness-kit-verify.ps1'
      - 'scripts/beta-qa-desktop-witness.ps1'
      - 'docs/BETA-QA-DESKTOP-WITNESS.md'
      - 'docs/BETA-QA-KIT.md'
      - '.github/workflows/beta-qa-witness-kit-contract.yml'
      - '.github/workflows/beta-candidate.yml'
  push:
    branches: [ main ]
    paths:
      - 'scripts/beta-qa-witness-kit.ps1'
      - 'scripts/beta-qa-witness-kit-verify.ps1'
      - 'scripts/beta-qa-desktop-witness.ps1'
      - 'docs/BETA-QA-DESKTOP-WITNESS.md'
      - 'docs/BETA-QA-KIT.md'
      - '.github/workflows/beta-qa-witness-kit-contract.yml'
      - '.github/workflows/beta-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-witness-companion:
    name: Verify hash-bound desktop witness companion
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PowerShell 7 witness companion self-test
        shell: pwsh
        run: ./scripts/beta-qa-witness-kit.ps1 -Mode self-test
      - name: Windows PowerShell 5.1 witness companion self-test
        shell: powershell
        run: .\scripts\beta-qa-witness-kit.ps1 -Mode self-test
